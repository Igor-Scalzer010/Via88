[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "road-safety"
version = "0.1.0"
description = "Evidence-based investigation of ANTT road accident records"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "duckdb>=1.4,<2", "httpx>=0.28,<1",
  "langchain>=1.0,<2", "langchain-openai>=1.0,<2", "langgraph>=1.1,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "aiosqlite>=0.21,<1",
  "python-dateutil>=2.9,<3", "typer>=0.15,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-python-dateutil>=2.9", "pip-tools>=7.4,<8"]

[project.scripts]
road-safety = "road_safety.cli:app"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["road_safety"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/road_safety"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true
